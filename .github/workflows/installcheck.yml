name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'

jobs:
  test:
    runs-on: ubuntu-latest
    container: pgxn/pgxn-tools
    strategy:
      matrix:
        pg: [18, 19]
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5
      - name: Start PostgreSQL ${{ matrix.pg }}
        run: pg-start ${{ matrix.pg }}
      # t/004_pgaudit.pl is skipped without pgaudit
      - name: Install pgaudit
        run: |
          if apt-cache show postgresql-${{ matrix.pg }}-pgaudit >/dev/null 2>&1; then
            apt-get install -y postgresql-${{ matrix.pg }}-pgaudit
          else
            echo "postgresql-${{ matrix.pg }}-pgaudit is not packaged"
          fi
      - name: Build and test
        run: |
          chown -R postgres:postgres .
          gosu postgres pg-build-test
