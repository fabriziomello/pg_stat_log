services:
  postgres:
    build: .
    environment:
      POSTGRES_PASSWORD: postgres
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_log
      - -c
      - log_min_messages=warning
      - -c
      - pg_stat_log.min_error_level=log
      - -c
      - max_connections=300
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql

  app_shop:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: app_shop
      PGPASSWORD: shop
      PGDATABASE: shop
    entrypoint: ["/demo/loop.sh"]
    restart: unless-stopped

  app_analytics:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: app_analytics
      PGPASSWORD: analytics
      PGDATABASE: analytics
    entrypoint: ["/demo/loop.sh"]
    restart: unless-stopped

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: postgresql://demo_monitor:monitor@postgres:5432/postgres?sslmode=disable
    command:
      - "--extend.query-path=/etc/postgres_exporter/queries.yaml"
      - "--disable-default-metrics"
      - "--disable-settings-metrics"
      # Built-in collectors are irrelevant here and some of them fail on PG 18
      # as demo_monitor, which would show up as demo noise in pg_stat_log.
      - "--no-collector.database"
      - "--no-collector.locks"
      - "--no-collector.replication"
      - "--no-collector.replication_slot"
      - "--no-collector.stat_bgwriter"
      - "--no-collector.stat_database"
      - "--no-collector.stat_user_tables"
      - "--no-collector.statio_user_tables"
      - "--no-collector.wal"
    volumes:
      - ./grafana/queries.yaml:/etc/postgres_exporter/queries.yaml:ro
    ports:
      - "9187:9187"
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./grafana/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=6h"
    ports:
      - "9090:9090"
    depends_on:
      - postgres_exporter

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/pg_stat_log.json
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
